spring:
  application:
    name: backend
  datasource:
    url: jdbc:postgresql://localhost:5432/academy
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  redis:
    host: localhost
    port: 6379
    timeout: 3000

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: info
    org.springframework.security: info
    org.springframework.web: info

app:
  s3:
    bucket: change-me
    region: change-me
  otp:
    ttl-seconds: 300

