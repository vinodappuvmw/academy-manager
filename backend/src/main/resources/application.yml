spring:
  application:
    name: backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/academy}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: ${HIBERNATE_FORMAT_SQL:false}
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    timeout: ${REDIS_TIMEOUT:3000}

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: ${LOG_LEVEL:info}
    org.springframework.security: ${LOG_LEVEL_SECURITY:info}
    org.springframework.web: ${LOG_LEVEL_WEB:info}
    org.hibernate.SQL: ${LOG_LEVEL_SQL:warn}
    org.hibernate.type.descriptor.sql.BasicBinder: ${LOG_LEVEL_SQL:warn}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://localhost:3002}
  s3:
    bucket: ${S3_BUCKET:change-me}
    region: ${S3_REGION:change-me}
  otp:
    ttl-seconds: ${OTP_TTL_SECONDS:300}

