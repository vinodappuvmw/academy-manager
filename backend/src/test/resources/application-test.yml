spring:
  datasource:
    url: jdbc:tc:postgresql:14:///academy_test
    username: test
    password: test
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  redis:
    host: localhost
    port: 6379

server:
  port: 0  # Random port for tests

logging:
  level:
    root: warn
    com.academy: debug
    org.springframework.web: debug

