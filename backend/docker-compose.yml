services:
  # PostgreSQL Database
  postgres:
    image: postgres:14-alpine
    container_name: academy-postgres
    environment:
      POSTGRES_DB: academy
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - academy-network

  # Redis (Optional - for caching/OTP)
  redis:
    image: redis:7-alpine
    container_name: academy-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - academy-network

  # Backend Application
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: academy-backend
    ports:
      - "8080:8080"
    environment:
      # Database connection (points to postgres service)
      DATABASE_URL: jdbc:postgresql://postgres:5432/academy
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      # Redis connection (points to redis service)
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Server configuration
      PORT: 8080
      # CORS (adjust for your frontend)
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:3001,http://localhost:3002
      # Logging
      LOG_LEVEL: info
      HIBERNATE_FORMAT_SQL: false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 3s
      start_period: 40s
      retries: 3
    networks:
      - academy-network
    restart: unless-stopped

networks:
  academy-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local

